[package]
name = "kk-crypto"
version = "0.1.0"
edition = "2021"
authors = ["John Keeney"]
description = "KK (Keeney Kode), A novel cryptographic primitive where symbol values are temporal functions of universal entropy"
license = "Apache-2.0"

[dependencies]
rand = { version = "0.8", optional = true }
rayon = { version = "1.10", optional = true }
zeroize = { version = "1", features = ["derive"] }
thiserror = { version = "1", optional = true }

[features]
default = ["std"]
std = ["rand", "rayon", "thiserror"]

[dev-dependencies]
hex = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
ratatui = "0.29"
crossterm = "0.28"
rpassword = "5"

[[bench]]
name = "kk_bench"
harness = false

[[bench]]
name = "session_bench"
harness = false

[[bench]]
name = "full_bench"
harness = false

[[example]]
name = "visual"
path = "examples/visual.rs"

[[example]]
name = "proof"
path = "examples/proof.rs"

[[example]]
name = "kk-journal"
path = "examples/kk_journal.rs"

[[example]]
name = "split_demo"
path = "examples/split_demo.rs"

[[example]]
name = "qkd_demo"
path = "examples/qkd_demo.rs"

[[bin]]
name = "kk-tool"
path = "src/bin/kk_tool.rs"
required-features = ["std"]

[profile.release]
lto = true
codegen-units = 1
