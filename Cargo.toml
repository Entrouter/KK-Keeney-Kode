[package]
name = "kk-crypto"
version = "0.1.0"
edition = "2021"
authors = ["John Keeney"]
description = "KK (Keeney Kode)  - A novel cryptographic primitive where symbol values are temporal functions of universal entropy"
license = "MIT"

[dependencies]
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
hex = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
ratatui = "0.29"
crossterm = "0.28"
rpassword = "5"

[[bench]]
name = "kk_bench"
harness = false

[[example]]
name = "visual"
path = "examples/visual.rs"

[[example]]
name = "proof"
path = "examples/proof.rs"

[[example]]
name = "kk-journal"
path = "examples/kk_journal.rs"
