[package]
name = "kk-crypto"
version = "0.1.0"
edition = "2021"
authors = ["John Keeney"]
description = "KK (Keeney Kode)  - A novel cryptographic primitive where symbol values are temporal functions of universal entropy"
license = "MIT"

[dependencies]
hkdf = "0.12"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
hex = "0.4"
