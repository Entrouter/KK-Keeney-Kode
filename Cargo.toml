[package]
name = "kk-crypto"
version = "0.1.5"
edition = "2021"
authors = ["John A Keeney"]
description = "KK (Keeney Kode), A novel cryptographic primitive where symbol values are temporal functions of universal entropy"
license-file = "LICENSE"
repository = "https://github.com/Entrouter/KK-Keeney-Kode"
homepage = "https://github.com/Entrouter/KK-Keeney-Kode"
readme = "README.md"
keywords = ["cryptography", "hash", "sponge", "cipher", "aead"]
categories = ["cryptography", "no-std"]

[dependencies]
rand = { version = "0.8", optional = true }
rayon = { version = "1.10", optional = true }
zeroize = { version = "1", features = ["derive"] }
thiserror = { version = "1", optional = true }
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
default = ["std"]
std = ["rand", "rayon", "thiserror"]
gpu = ["wgpu", "pollster", "bytemuck", "std"]
cuda = ["std"]

[dev-dependencies]
hex = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"
ratatui = "0.29"
crossterm = "0.28"
rpassword = "5"

[[bench]]
name = "kk_bench"
harness = false

[[bench]]
name = "session_bench"
harness = false

[[bench]]
name = "full_bench"
harness = false

[[bench]]
name = "gpu_bench"
harness = false
required-features = ["gpu"]

[[bench]]
name = "cuda_bench"
harness = false
required-features = ["cuda"]

[[bench]]
name = "rayon_bench"
harness = false

[[example]]
name = "visual"
path = "examples/visual.rs"

[[example]]
name = "proof"
path = "examples/proof.rs"

[[example]]
name = "kk-journal"
path = "examples/kk_journal.rs"

[[example]]
name = "split_demo"
path = "examples/split_demo.rs"

[[example]]
name = "qkd_demo"
path = "examples/qkd_demo.rs"

[[bin]]
name = "kk-tool"
path = "src/bin/kk_tool.rs"
required-features = ["std"]

[build-dependencies]
cc = { version = "1", features = ["parallel"] }

[profile.release]
lto = true
codegen-units = 1
